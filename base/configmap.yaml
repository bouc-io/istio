kind: ConfigMap
apiVersion: v1
metadata:
  name: istio
  namespace: istio-system
  labels:
    install.operator.istio.io/owning-resource: unknown
    install.operator.istio.io/owning-resource-namespace: istio-system
    operator.istio.io/component: Pilot
    operator.istio.io/managed: Reconcile
    operator.istio.io/version: 1.12.1
    release: istio
    istio.io/rev: default
data:
  mesh: |-
    accessLogFile: /dev/stdout
    defaultConfig:
      discoveryAddress: istiod.istio-system.svc:15012
      proxyMetadata: {}
      tracing:
        zipkin:
          address: zipkin.istio-system:9411
    enablePrometheusMerge: true
    rootNamespace: istio-system
    enableTracing: false
    outboundTrafficPolicy:
      mode: ALLOW_ANY
    trustDomain: cluster.local
    extensionProviders:
    - name: "oauth2-proxy"
      envoyExtAuthzHttp:
        service: "oauth2-proxy-rel.oauth2-proxy.svc.cluster.local"
        port: "80" # The default port used by oauth2-proxy.
        includeRequestHeadersInCheck: ["authorization", "cookie", "x-ext-authz", "x-forwarded-access-token", "x-forwarded-user", "x-forwarded-email", "x-forwarded-proto", "proxy-authorization", "user-agent", "x-forwarded-host", "from", "x-forwarded-for", "x-forwarded-uri", "x-auth-request-redirect", "accept"] # headers sent to the oauth2-proxy in the check request.
        headersToUpstreamOnAllow: ["authorization", "path", "cookie", "x-auth-request-user", "x-auth-request-email", "x-auth-request-access-token", "x-forwarded-access-token"] # headers sent to backend application when request is allowed.
        headersToDownstreamOnAllow: ["content-type", "set-cookie"] # headers sent back to the client when request is allowed.
        headersToDownstreamOnDeny: ["content-type", "set-cookie"] # headers sent back to the client when request is denied.
  meshNetworks:
    "networks: {}"

    # - name: "oauth2-proxy"
    #   envoyExtAuthzHttp:
    #     service: "oauth2-proxy-rel.oauth2-proxy.svc.cluster.local"
    #     port: "4180" # The default port used by oauth2-proxy.
    #     includeRequestHeadersInCheck: ["authorization", "cookie"] # headers sent to the oauth2-proxy in the check request.
    #     headersToUpstreamOnAllow: ["authorization", "path", "x-auth-request-user", "x-auth-request-email", "x-auth-request-access-token"] # headers sent to backend application when request is allowed.
    #     headersToDownstreamOnAllow: ["content-type", "set-cookie"] # headers sent back to the client when request is allowed.
    #     headersToDownstreamOnDeny: ["content-type", "set-cookie"] # headers sent back to the client when request is denied.

