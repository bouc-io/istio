  components:
    base:
      k8s:
        replicaCount: 1
        podDisruptionBudget:
          minAvailable: 0%
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          replicaCount: 1
          podDisruptionBudget:
            minAvailable: 0%
    egressGateways:
      - name: istio-egressgateway
        enabled: true
        k8s:
          replicaCount: 1
          podDisruptionBudget:
            minAvailable: 0%
    pilot:
      k8s:
        replicaCount: 1
        podDisruptionBudget:
          minAvailable: 0%
