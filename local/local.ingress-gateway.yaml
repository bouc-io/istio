  namespace: default # TODO: to be adjusted later on.  Added for FluxCD server-side application for now.
spec:
  # Container/chart registry egress for meshed clients (kubelet pulls bypass the
  # mesh). pkg-containers.githubusercontent.com is ghcr.io's blob CDN; harmless
  # when REGISTRY_HOST points elsewhere (e.g. registry.gitlab.com).
  hosts:
    - ${REGISTRY_HOST:=ghcr.io}
    - pkg-containers.githubusercontent.com
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  resolution: DNS
  location: MESH_EXTERNAL
