    # Aggregated OpenAPI documentation (apidocs-api-server). One prefix match covers the
    # whole subtree the browser loads: the HTML page, the Swagger UI assets, and each
    # /v1/api-docs/specs/*.json. Do not add per-asset or per-spec routes.
    #
    # No corsPolicy here, unlike the routes above: the docs page and everything it fetches
    # are all on api.${CLUSTER_DOMAIN}, so no request is ever cross-origin. The upstream
    # services' own /openapi.json paths stay east-west and are deliberately not routed.
    #
    # No rewrite either: the app mounts on /v1/api-docs, the same absolute path it is
    # served on, because Swagger UI resolves its assets relatively.
    - match:
        - uri:
            prefix: /v1/api-docs
          gateways:
            - mesh
      route:
        - destination:
            host: apidocs-api-chart.default.svc.cluster.local
            port:
              number: 80
      name: "to-api-route-for-apidocs"
