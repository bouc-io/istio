# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: boucio-ingress
#   namespace: istio-system
#   #annotations:
#   #  kubernetes.io/ingress.class: gce
#   #  kubernetes.io/ingress.global-static-ip-name: "your-static-ip-name"  # Replace with your static IP name
#   #  kubernetes.io/ingress.global-static-ip-name: example-com-lb-static-ip
#   #  networking.gke.io/v1beta1.FrontendConfig: ssl-redirect-frontendconfig
#   #  ingress.gcp.kubernetes.io/pre-shared-cert: ssl-example-com
# spec:
#   rules:
#     - host: "*.${CLUSTER_DOMAIN}"
#       http:
#         paths:
#           - pathType: Prefix
#             path: "/"
#             backend:
#               service:
#                 name: istio-ingressgateway #.istio-system.svc.cluster.local # Replace with the name of your default service
#                 port:
#                   number: 80
#   defaultBackend:
#     service:
#       name: istio-ingressgateway
#       port:
#         number: 80
#   tls:
#     - hosts:
#         - "${CLUSTER_DOMAIN}"
#         - "*.${CLUSTER_DOMAIN}"
#       secretName: bouc-local-tls-secret
# ---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: boucio-gateway
  namespace: default # TODO: to be adjusted later on.  Added for FluxCD server-side application for now.
spec:
  selector:
    app: istio-ingressgateway
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - app.${CLUSTER_DOMAIN}
        - admin.${CLUSTER_DOMAIN}
        - portal.${CLUSTER_DOMAIN}
        - api.${CLUSTER_DOMAIN}
        - www.${CLUSTER_DOMAIN}
        - sso.${CLUSTER_DOMAIN}
        - prometheus.${CLUSTER_DOMAIN}
        - grafana.${CLUSTER_DOMAIN}
        - kiali.${CLUSTER_DOMAIN}
        - chat.${CLUSTER_DOMAIN}
        - agent.${CLUSTER_DOMAIN}
        - tracing.${CLUSTER_DOMAIN}
        - jaeger.${CLUSTER_DOMAIN}
        - memory.${CLUSTER_DOMAIN}
      tls:
        httpsRedirect: false # Required as ACME challenge needs to be done under HTTP; HTTPS redirect handled within the VirtualSerice.
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - app.${CLUSTER_DOMAIN}
        - api.${CLUSTER_DOMAIN}
        - admin.${CLUSTER_DOMAIN}
        - portal.${CLUSTER_DOMAIN}
        - www.${CLUSTER_DOMAIN}
        - sso.${CLUSTER_DOMAIN}
        - prometheus.${CLUSTER_DOMAIN}
        - grafana.${CLUSTER_DOMAIN}
        - kiali.${CLUSTER_DOMAIN}
        - chat.${CLUSTER_DOMAIN}
        - agent.${CLUSTER_DOMAIN}
        - tracing.${CLUSTER_DOMAIN}
        - jaeger.${CLUSTER_DOMAIN}
        - memory.${CLUSTER_DOMAIN}
      tls:
        mode: SIMPLE
        minProtocolVersion: TLSV1_2
        # minProtocolVersion: TLS_AUTO
        credentialName: bouc-local-tls-secret
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: boucio-root-virtualservice
  namespace: default # TODO: to be adjusted later on.  Added for FluxCD server-side application for now.
spec:
  hosts:
    - "${CLUSTER_DOMAIN}"
  gateways:
    - boucio-gateway
    - mesh
  http:
    - redirect:
        authority: "www.${CLUSTER_DOMAIN}"
        scheme: https
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: boucio-www-virtualservice
  namespace: default # TODO: to be adjusted later on.  Added for FluxCD server-side application for now.
spec:
  hosts:
    - "www.${CLUSTER_DOMAIN}"
  gateways:
    - boucio-gateway
    - mesh
  http:
    - match:
        - scheme:
            exact: http
      redirect:
        scheme: https
    - match:
        - gateways:
            - mesh
            - boucio-gateway
      route:
        - destination:
            host: web-chart-service.default.svc.cluster.local
            port:
              number: 80
      name: "to-www-route"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: boucio-sso-virtualservice
  namespace: default # TODO: to be adjusted later on.  Added for FluxCD server-side application for now.
spec:
  hosts:
    - "sso.${CLUSTER_DOMAIN}"
  gateways:
    - boucio-gateway
    - mesh
  http:
    - match:
        - scheme:
            exact: http
      redirect:
        scheme: https
    - route:
        - destination:
            host: keycloak-release.keycloak.svc.cluster.local
            port:
              number: 80
              #number: 443
      corsPolicy: # CORS policy required since app.* will be calling sso.${CLUSTER_DOMAIN} to obtain the tokens.
        allowOrigins:
          - exact: https://app.${CLUSTER_DOMAIN}
          - exact: https://chat.${CLUSTER_DOMAIN}
          - exact: https://agent.${CLUSTER_DOMAIN}
          - exact: https://memory.${CLUSTER_DOMAIN}
          - exact: https://admin.${CLUSTER_DOMAIN}
          - exact: https://portal.${CLUSTER_DOMAIN}
          - exact: http://localhost:3000
          - exact: http://localhost:8080
          - exact: http://localhost:8081
          - exact: https://oauth.pstmn.io
        allowMethods:
          - POST
          - GET
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowCredentials: true
        allowHeaders:
          - content-type
          - authorization
          - x-auth-request-access-token
          - Access-Control-Allow-Origin
          - gap-auth
          - server
          - x-auth-request-email
          - x-auth-request-preferred-username
          - x-envoy-upstream-service-time
          - refresh-token
          - X-Forwarded-For
          - x-active-org
          - forwarded
        maxAge: "24h"
      name: "to-keycloak-route"
---
apiVersion: networking.istio.io/v1beta1
